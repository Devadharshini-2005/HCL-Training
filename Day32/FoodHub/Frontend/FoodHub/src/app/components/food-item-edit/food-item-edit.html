
<div class="form-container">

  <h2>Edit Food Item</h2>

  @if (isLoading) {
    <p class="status-message">Loading food item...</p>
  }

  @if (!isLoading && !errorMessage) {

    <form (ngSubmit)="updateFoodItem()">

      <div class="form-group">
        <label>Food Name</label>
        <input
          type="text"
          name="foodName"
          [(ngModel)]="foodItem.foodName"
          required
          minlength="2"
          maxlength="100">
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea
          name="description"
          [(ngModel)]="foodItem.description"
          maxlength="500">
        </textarea>
      </div>

      <div class="form-group">
        <label>Price (₹)</label>
        <input
          type="number"
          name="price"
          [(ngModel)]="foodItem.price"
          min="0.01"
          required>
      </div>

      <div class="form-group">
        <label>Image URL</label>
        <input
          type="text"
          name="imageUrl"
          [(ngModel)]="foodItem.imageUrl">
      </div>

      <div class="form-group">
        <label>Category</label>

        @if (categoryLoading) {
          <p>Loading categories...</p>
        }
        @else if (categoryError) {
          <p class="error-message">{{ categoryError }}</p>

          <button
            type="button"
            (click)="loadCategories()">
            Retry
          </button>
        }
        @else {
          <select
  name="categoryId"
  [(ngModel)]="foodItem.categoryId"
  [compareWith]="compareCategoryIds"
  required>

  <option [ngValue]="0" disabled>
    Select category
  </option>

  @for (category of categories; track category.categoryId) {
    <option [ngValue]="category.categoryId">
      {{ category.categoryName }}
    </option>
  }

</select>
        }
      </div>

      <button
        type="submit"
        [disabled]="categoryLoading || categories.length === 0">
        Update Food Item
      </button>

    </form>
  }

  @if (successMessage) {
    <p class="success-message">{{ successMessage }}</p>
  }

  @if (errorMessage) {
    <p class="error-message">{{ errorMessage }}</p>
  }

</div>
