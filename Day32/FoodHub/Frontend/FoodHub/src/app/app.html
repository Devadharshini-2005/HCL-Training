
<header class="header">

  <div class="header-content">

    <div class="brand">
      <h1>FoodHub</h1>
      <p>Food Menu Management System</p>
    </div>

    <nav class="navigation">

      <a routerLink="/"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }">
        Home
      </a>

      <a routerLink="/categories"
         routerLinkActive="active">
        Categories
      </a>

      @if (userRole === 'Admin') {

        <a routerLink="/food-items/add"
           routerLinkActive="active">
          Add Food
        </a>

        <a routerLink="/categories/add"
           routerLinkActive="active">
          Add Category
        </a>

      }

      @if (!isLoggedIn) {

        <a routerLink="/register"
           routerLinkActive="active">
          Register
        </a>

        <a routerLink="/login"
           routerLinkActive="active">
          Login
        </a>

      }

      @if (isLoggedIn) {

        <span class="user-role">
          {{ userRole }}
        </span>

        <button type="button"
                (click)="logout()">
          Logout
        </button>

      }

    </nav>

  </div>

</header>

<main class="main-content">
  <router-outlet></router-outlet>
</main>
